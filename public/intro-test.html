<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>導入アニメ 切り分けテスト</title>
<!--
  切り分け用の一時ページ。原因が分かり次第削除する。
  アプリ(React)とは無関係に、SVG/SMIL だけを置いて計測する。

  知りたいのは次の区別:
   (A) 1回のページ表示の中で、アニメーションが2回発火している
   (B) ページ自体が2回読み込まれ、そのたびに1回ずつ再生している
  発火回数とページ読み込み回数を画面に出して見分ける。
-->
<style>
  html, body { margin: 0; height: 100%; background: #fff;
    font: 14px/1.7 -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif; }
  .stage { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; }
  .bg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .arrow { position: relative; width: min(40vmin, 190px); height: min(40vmin, 190px); }

  .panel {
    position: fixed; left: 12px; right: 12px; top: 12px; z-index: 10;
    background: rgba(255,255,255,.94); border: 1px solid #ccd; border-radius: 12px;
    padding: 12px 14px; pointer-events: auto;
  }
  .row { display: flex; justify-content: space-between; gap: 12px; }
  .k { color: #667; }
  .v { font-weight: 700; font-variant-numeric: tabular-nums; }
  .big { font-size: 22px; }
  .btns { margin-top: 10px; display: flex; gap: 8px; }
  .btn { flex: 1; text-align: center; padding: 10px; border-radius: 10px; background: #4a90d9;
    color: #fff; text-decoration: none; border: 0; font: inherit; }
  .btn.alt { background: #7a869a; }
</style>
</head>
<body>

<div class="panel">
  <div class="row"><span class="k">アニメの発火回数（このページ表示内）</span><span class="v big" id="begins">0</span></div>
  <div class="row"><span class="k">ページ読み込み回数（連番）</span><span class="v big" id="loads">-</span></div>
  <div class="row"><span class="k">読み込みの種類</span><span class="v" id="navtype">-</span></div>
  <div class="row"><span class="k">Service Worker</span><span class="v" id="sw">-</span></div>
  <div class="btns">
    <a class="btn" href="/intro-test.html">もう一度</a>
    <button class="btn alt" id="reset">回数をリセット</button>
  </div>
</div>

<div class="stage" aria-hidden="true">
  <svg class="bg" viewBox="0 0 1 1" preserveAspectRatio="none">
    <rect width="1" height="1" fill="#dceef8">
      <animate attributeName="opacity" values="1;1;0" keyTimes="0;0.78;1" dur="1.6s" fill="freeze" />
    </rect>
  </svg>

  <svg class="arrow" viewBox="0 0 100 100">
    <path id="line"
      d="M 20.5 77 C 24 71.5, 27 66, 30 60.5 C 33 55, 34.5 50.5, 37 46 C 40 41.5, 43.5 37.5, 46.5 40.5 C 49.3 43.3, 50.3 55.5, 52.8 61 C 54.8 64.5, 57.5 63, 60 57 C 62.5 51, 65.5 46, 69 40.5 C 70.5 38, 71.8 36.3, 73 35"
      pathLength="1" fill="none" stroke="#fff" stroke-width="10"
      stroke-linecap="round" stroke-linejoin="round"
      stroke-dasharray="1" stroke-dashoffset="1">
      <animate id="draw" attributeName="stroke-dashoffset"
        values="1;0;0;-1" keyTimes="0;0.48;0.58;1"
        calcMode="spline" keySplines="0.65 0 0.35 1;0 0 1 1;0.55 0 0.35 1"
        dur="1.25s" begin="0.06s" fill="freeze" />
    </path>

    <path d="M 61 30 L 79.5 20.5 L 82 42 Z" fill="#fff" stroke="#fff"
          stroke-width="4" stroke-linejoin="round" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0"
        keyTimes="0;0.40;0.54;0.72;1" dur="1.25s" begin="0.06s" fill="freeze" />
      <animateTransform attributeName="transform" type="translate"
        values="0 0;0 0;14 -14" keyTimes="0;0.72;1"
        calcMode="spline" keySplines="0 0 1 1;0.55 0 0.35 1"
        dur="1.25s" begin="0.06s" fill="freeze" />
    </path>
  </svg>
</div>

<script>
  // ページ読み込みの通し番号（sessionStorage はページを跨いで残る）
  var loads = Number(sessionStorage.getItem("intro-loads") || 0) + 1;
  sessionStorage.setItem("intro-loads", String(loads));
  document.getElementById("loads").textContent = String(loads);

  // 読み込みの種類（navigate / reload / back_forward）
  try {
    var nav = performance.getEntriesByType("navigation")[0];
    document.getElementById("navtype").textContent = nav ? nav.type : "不明";
  } catch (e) { document.getElementById("navtype").textContent = "取得不可"; }

  // Service Worker が効いているか
  document.getElementById("sw").textContent =
    ("serviceWorker" in navigator && navigator.serviceWorker.controller) ? "有効" : "無し";

  // SMIL の発火回数を数える（これが 2 ならページ内で2回発火＝WebKitがやり直している）
  var begins = 0;
  var el = document.getElementById("draw");
  el.addEventListener("beginEvent", function () {
    begins++;
    document.getElementById("begins").textContent = String(begins);
  });

  document.getElementById("reset").addEventListener("click", function () {
    sessionStorage.removeItem("intro-loads");
    location.reload();
  });
</script>

</body>
</html>
